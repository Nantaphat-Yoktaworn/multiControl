services:
  multicontrol-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: multicontrol-hub:latest
    container_name: multicontrol-hub
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - MULTICONTROL_PORT=${MULTICONTROL_PORT:-8765}
      - MULTICONTROL_UDP_PORT=${MULTICONTROL_UDP_PORT:-8766}
      - MULTICONTROL_LAN_IP=${MULTICONTROL_LAN_IP:-}
      - MULTICONTROL_TAILSCALE_IP=${MULTICONTROL_TAILSCALE_IP:-}
      - MULTICONTROL_TOKEN=${MULTICONTROL_TOKEN:-}
    ports:
      - "${MULTICONTROL_PORT:-8765}:8765/tcp"
      - "${MULTICONTROL_UDP_PORT:-8766}:8766/udp"
    volumes:
      - ./data:/app/data
