services:
  multicontrol-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: multicontrol-hub:latest
    container_name: multicontrol-hub
    restart: always
    environment:
      - TZ=UTC
      - MULTICONTROL_PORT=8765
      - MULTICONTROL_UDP_PORT=8766
      - MULTICONTROL_LAN_IP=192.168.1.100
      - MULTICONTROL_TAILSCALE_IP=100.64.0.10
    ports:
      - "8765:8765/tcp"
      - "8766:8766/udp"
    volumes:
      - ./data:/app/data
